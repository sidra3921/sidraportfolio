<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Banner: End-to-End ML Pipeline with FastAPI model serving -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#050d18"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".2"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="600" cy="120" r="220" fill="url(#glow)"/>

  <!-- Pipeline stages -->
  <g font-family="'JetBrains Mono', Consolas, Menlo, monospace">
    <g fill="#12203e" stroke="#22d3ee" stroke-opacity=".45">
      <rect x="34" y="78" width="104" height="66" rx="12"/>
      <rect x="160" y="78" width="104" height="66" rx="12"/>
      <rect x="286" y="78" width="104" height="66" rx="12"/>
      <rect x="412" y="78" width="104" height="66" rx="12"/>
      <rect x="538" y="78" width="104" height="66" rx="12"/>
    </g>
    <rect x="664" y="78" width="104" height="66" rx="12" fill="url(#acc)"/>

    <g font-size="11" fill="#22d3ee">
      <text x="46" y="98">01</text><text x="172" y="98">02</text><text x="298" y="98">03</text>
      <text x="424" y="98">04</text><text x="550" y="98">05</text>
    </g>
    <text x="676" y="98" font-size="11" fill="#03121a">06</text>

    <g font-size="15" font-weight="600" fill="#e6edf7" text-anchor="middle">
      <text x="86" y="126">Ingest</text>
      <text x="212" y="126">EDA</text>
      <text x="338" y="126">Features</text>
      <text x="464" y="126">Train</text>
      <text x="590" y="126">Evaluate</text>
    </g>
    <text x="716" y="126" font-size="15" font-weight="700" fill="#03121a" text-anchor="middle">FastAPI</text>
  </g>

  <g stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M140 111 H156"/><path d="M266 111 H282"/><path d="M392 111 H408"/>
    <path d="M518 111 H534"/><path d="M644 111 H660"/>
  </g>

  <!-- Accuracy chart -->
  <rect x="34" y="186" width="330" height="196" rx="14" fill="#0d1a33" stroke="#94a3b8" stroke-opacity=".18"/>
  <text x="56" y="218" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="12" fill="#8b9bb3">model accuracy</text>
  <path d="M56 352 H342" stroke="#94a3b8" stroke-opacity=".3"/>
  <path d="M56 268 H342" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="4 6"/>
  <g fill="#22d3ee" fill-opacity=".35">
    <rect x="76" y="318" width="34" height="34" rx="5"/>
    <rect x="128" y="300" width="34" height="52" rx="5"/>
    <rect x="180" y="288" width="34" height="64" rx="5"/>
    <rect x="232" y="276" width="34" height="76" rx="5"/>
  </g>
  <rect x="284" y="260" width="34" height="92" rx="5" fill="url(#acc)"/>
  <text x="301" y="248" text-anchor="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#34d399">80%+</text>

  <!-- API panel -->
  <rect x="392" y="186" width="376" height="196" rx="14" fill="#0a1428" stroke="#94a3b8" stroke-opacity=".18"/>
  <circle cx="416" cy="210" r="5" fill="#f87171" fill-opacity=".8"/>
  <circle cx="434" cy="210" r="5" fill="#fbbf24" fill-opacity=".8"/>
  <circle cx="452" cy="210" r="5" fill="#34d399" fill-opacity=".8"/>
  <g font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="14" fill="#c7d2e3">
    <text x="414" y="250"><tspan fill="#22d3ee" font-weight="700">POST</tspan> /predict</text>
    <text x="414" y="280" fill="#8b9bb3">{ "features": [5.1, 3.5, …] }</text>
    <text x="414" y="318"><tspan fill="#34d399" font-weight="700">200 OK</tspan></text>
    <text x="414" y="346" fill="#8b9bb3">{ "prediction": 1, "proba": 0.87 }</text>
  </g>
</svg>
